server:
  port: 8080

spring:
  application:
    name: srbms-backend

  datasource:
    # URL kết nối tới PostgreSQL (Cổng mặc định: 5432, Tên DB: srbms_db)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:srbms_db}
    username: ${DB_USERNAME:postgres}
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # CHỨC NĂNG TỰ ĐỘNG TẠO/CẬP NHẬT TABLE TRONG POSTGRESQL SAU KHI RUN
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Cấu hình Secret Key và thời hạn của JWT Token (24 giờ)
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000
